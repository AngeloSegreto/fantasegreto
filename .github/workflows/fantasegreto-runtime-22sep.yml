name: FantaSegreto Runtime Current Safe Gate

on:
  push:
    paths:
      - 'app.js'
      - 'engine.js'
      - 'index.html'
      - 'sw.js'
      - 'registry.json'
      - 'player-details.json'
      - 'version.json'
      - 'listone-08oct2026.json'
      - '.github/workflows/fantasegreto-runtime-22sep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js engine.js sw.js opponent-market-v1.js opponents.js piano25.js state-manager.js audit.js; do
            test -f "$f"
            node --check "$f"
          done
      - name: Verify official roster and fail-closed auction mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path(name).read_text(encoding='utf-8'))

          reg=load('registry.json')
          det=load('player-details.json')
          ver=load('version.json')
          official=load('listone-08oct2026.json')
          app=Path('app.js').read_text(encoding='utf-8')
          engine=Path('engine.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          players=reg.get('players',[])
          expected=int(ver.get('runtime_registry_count',0))
          assert expected==536 and reg.get('count')==expected and len(players)==expected, 'Official active roster count mismatch'
          ids=[p['id'] for p in players]
          official_ids=[str(p['official_id']) for p in players]
          assert len(set(ids))==expected, 'Duplicate runtime player ID'
          assert len(set(official_ids))==expected, 'Duplicate official player ID'
          assert all(p.get('serie_a_membership')=='ACTIVE_OFFICIAL_08OCT2026' for p in players), 'Stale membership'
          assert official.get('active_count')==expected, 'Official listone count mismatch'
          assert {str(p['official_id']) for p in official.get('players',[])}==set(official_ids), 'Listone and registry IDs differ'
          assert det.get('count')==len(det.get('details',{})), 'Legacy details internally inconsistent'
          # Legacy details are an archive; the runtime reconciles them by active player ID.
          assert 'Legacy details count may differ' in app, 'Current-ID detail reconciliation missing'
          assert ver.get('optimizerMax_mutated') is False, 'Golden optimizer changed'
          assert ver.get('model_recalculation_status')=='PENDING_FULL_FOS_RISK_MAX_08OCT', 'Unreviewed model activation'
          assert all(p.get(k) is None for p in players for k in ('score','ideal','max')), 'Uncertified BUY/MAX reintroduced'
          assert "return 'WAIT · FOS PENDING'" in app, 'UI fail-closed guard missing'
          assert 'S.shortlist63=blocked?null:sl63' in app, 'Historical shortlist exposed during safe mode'
          assert 'window.FS_FOS_CANDIDATES=blocked?null:cand' in app, 'Historical FOS candidates exposed during safe mode'
          assert 'window.FS_SHORTLIST63=blocked?null:sl63' in app, 'Historical shortlist global exposed during safe mode'
          assert "if(fsModelBlocked())return 0;" in engine, 'Engine MAX guard missing'
          assert "if(fsModelBlocked())return 'WAIT';" in engine, 'Engine decision guard missing'
          assert "if(fsModelBlocked())return [];" in engine, 'Engine candidate guard missing'
          assert 'fantasegreto-v4-2-4-08oct-fail-closed-r1' in sw, 'PWA cache stale'
          assert 'sw.js?v=42408' in idx, 'PWA registration stale'
          print('FS_OFFICIAL_08OCT_RUNTIME_SAFE_PASS',expected)
          print('FS_LEGACY_DETAILS_ARCHIVED',len(det.get('details',{})))
          print('FS_BUY_MAX_FAIL_CLOSED_PASS')
          print('FS_PREMIUM_MODEL_PENDING_NOT_CERTIFIED')
          PY
